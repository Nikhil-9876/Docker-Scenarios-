<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Prediction with Database (Scenario 2)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            color: #1e293b;
            margin-top: 0;
            font-size: 24px;
        }
        .badge {
            display: inline-block;
            background: #e0f2fe;
            color: #0284c7;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #475569;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button.secondary {
            background: #64748b;
            margin-left: 10px;
        }
        button.secondary:hover {
            background: #475569;
        }
        #result {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            display: none;
            font-size: 16px;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 8px 12px;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">Scenario 2: Single Container (Web + SQLite DB)</span>
        <h1>Iris Flower Prediction</h1>

        <div class="form-group">
            <label for="sepal_length">Sepal Length (cm)</label>
            <input type="number" id="sepal_length" placeholder="e.g. 5.1" step="0.1" value="5.1">
        </div>

        <div class="form-group">
            <label for="sepal_width">Sepal Width (cm)</label>
            <input type="number" id="sepal_width" placeholder="e.g. 3.5" step="0.1" value="3.5">
        </div>

        <div class="form-group">
            <label for="petal_length">Petal Length (cm)</label>
            <input type="number" id="petal_length" placeholder="e.g. 1.4" step="0.1" value="1.4">
        </div>

        <div class="form-group">
            <label for="petal_width">Petal Width (cm)</label>
            <input type="number" id="petal_width" placeholder="e.g. 0.2" step="0.1" value="0.2">
        </div>

        <div>
            <button onclick="predict()">Make Prediction</button>
            <button class="secondary" onclick="loadHistory()">Refresh History</button>
        </div>

        <div id="result"></div>

        <h3 style="margin-top: 30px; font-size: 16px; color: #1e293b;">Prediction History (Stored in Database)</h3>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Sepal L/W</th>
                    <th>Petal L/W</th>
                    <th>Prediction</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <tr><td colspan="5" style="text-align:center; color:#94a3b8;">Click 'Refresh History' or submit a prediction</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function predict() {
            const data = {
                sepal_length: Number(document.getElementById("sepal_length").value),
                sepal_width: Number(document.getElementById("sepal_width").value),
                petal_length: Number(document.getElementById("petal_length").value),
                petal_width: Number(document.getElementById("petal_width").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const resDiv = document.getElementById("result");
            resDiv.style.display = "block";
            resDiv.innerText = "Prediction: " + result.prediction;

            loadHistory();
        }

        async function loadHistory() {
            try {
                const res = await fetch("/history");
                const records = await res.json();
                const tbody = document.getElementById("historyBody");
                tbody.innerHTML = "";

                if (!records || records.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#94a3b8;'>No records found in database</td></tr>";
                    return;
                }

                records.forEach(r => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${r.id}</td>
                        <td>${r.sepal_length} / ${r.sepal_width}</td>
                        <td>${r.petal_length} / ${r.petal_width}</td>
                        <td><strong>${r.prediction}</strong></td>
                        <td>${new Date(r.timestamp).toLocaleTimeString()}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Error loading history:", err);
            }
        }

        window.onload = loadHistory;
    </script>
</body>
</html>
